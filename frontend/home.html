<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Care Companion</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
  <style>
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(8px);
      z-index: 1000;
      display: flex;
      justify-content: center;
      align-items: center;
      animation: fadeIn 0.3s ease;
    }

    .modal-content {
      width: 90%;
      max-width: 500px;
      padding: 30px;
      text-align: center;
      transform: scale(0.9);
      animation: modalPop 0.3s ease forwards;
    }

    @keyframes modalPop {
      to { transform: scale(1); }
    }
  </style>
</head>

<body>
  <!-- Dark Mode Init -->
  <script>
    if (localStorage.getItem('theme') === 'dark') {
      document.body.classList.add('dark-theme');
    }
  </script>

  <div class="app-layout">
    
    <!-- Sidebar -->
    <div id="sidebar" class="sidebar glass-panel">
      <div class="sidebar-header">
        <h2>
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
          Care App
        </h2>
        <button class="mobile-close-btn" onclick="toggleSidebar()">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>

      <div class="sidebar-nav">
        <button id="nav-chat" class="nav-btn active" onclick="showSection('chat')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
          Chat
        </button>
        <button id="nav-care" class="nav-btn" onclick="showSection('care')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
          CareCircle
        </button>
        <button id="nav-history" class="nav-btn" onclick="showSection('history')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
          History
        </button>
      </div>

      <div class="logout-container">
        <button class="logout-btn" onclick="logout()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
          Log Out
        </button>
      </div>
    </div>

    <!-- Main Content Area -->
    <div class="main-area">
      
      <!-- Top Bar -->
      <div class="top-bar">
        <div class="top-bar-left">
          <button class="mobile-menu-btn" onclick="toggleSidebar()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
          </button>
          <div class="welcome-msg" id="welcome">Welcome</div>
        </div>

        <div class="top-bar-right">
          <button class="theme-toggle" onclick="toggleTheme()" id="themeToggleBtn">
            <!-- SVG updated via JS -->
          </button>
          <img id="userAvatar" src="https://ui-avatars.com/api/?name=User&background=6366f1&color=fff" class="user-avatar" alt="Avatar">
        </div>
      </div>

      <!-- Content Container -->
      <div class="content-container">
        
        <!-- CHAT -->
        <div id="chat" class="section active">
          <div class="chat-box" id="chatBox">
            <!-- Messages go here -->
          </div>
          
          <div class="emoji-quick-replies" id="emojiQuickReplies">
             <button class="emoji-btn" onclick="sendEmojiMessage('happy', '😊')" title="Happy">😊</button>
             <button class="emoji-btn" onclick="sendEmojiMessage('sad', '😢')" title="Sad">😢</button>
             <button class="emoji-btn" onclick="sendEmojiMessage('angry', '😠')" title="Angry">😠</button>
             <button class="emoji-btn" onclick="sendEmojiMessage('tired', '😫')" title="Tired">😫</button>
             <button class="emoji-btn" onclick="sendEmojiMessage('frustrated', '😤')" title="Frustrated">😤</button>
             <button class="emoji-btn" onclick="sendEmojiMessage('dizzy', '😵')" title="Dizzy">😵</button>
             <button class="emoji-btn" onclick="sendEmojiMessage('excited', '🤩')" title="Excited">🤩</button>
             <button class="emoji-btn" onclick="sendEmojiMessage('anxious', '😰')" title="Anxious">😰</button>
          </div>

          <div class="chat-input-area">
            <button class="mic-btn" id="micBtn" onclick="startDictation()" title="Click to speak">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
            </button>
            <button class="mic-btn" onclick="document.getElementById('imageInput').click()" title="Upload Image">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
            </button>
            <button class="mic-btn" onclick="openCamera()" title="Use Camera">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
            </button>
            <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="previewImage(event)">
            <input id="input" placeholder="How are you feeling today?" onkeypress="if(event.key === 'Enter') handleSend()"/>
            <button class="send-btn" onclick="handleSend()">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
          </div>
          <!-- Image Preview Area -->
          <div id="imagePreviewContainer" style="display: none; padding: 10px; margin-top: 10px; position: relative; width: fit-content;">
              <img id="imagePreview" src="" style="max-height: 100px; border-radius: 12px; border: 1px solid var(--glass-border); display: block;">
              <div id="detectedEmotionLabel" style="font-size: 13px; font-weight: 500; color: var(--primary-accent); margin-top: 8px;">Waiting for detection...</div>
              <button onclick="clearImage()" style="position: absolute; top: -5px; right: -5px; background: var(--danger); color: white; border: none; border-radius: 50%; width: 22px; height: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.2);">×</button>
          </div>
        </div>

        <!-- Camera Modal -->
        <div id="cameraModal" class="modal-overlay" style="display: none;">
          <div class="modal-content glass-panel">
            <video id="cameraVideo" autoplay playsinline style="width: 100%; border-radius: 12px;"></video>
            <div class="modal-buttons" style="margin-top: 20px; display: flex; gap: 15px; justify-content: center;">
              <button class="primary-btn" onclick="captureImage()">Capture</button>
              <button class="logout-btn" style="border-color: var(--text-secondary); color: var(--text-secondary); height: auto; padding: 10px 20px;" onclick="closeCamera()">Cancel</button>
            </div>
          </div>
        </div>

        <!-- CARE CIRCLE -->
        <div id="care" class="section">
          <div class="section-header">
            <h3>CareCircle</h3>
          </div>

          <div class="input-group">
            <input id="contact" placeholder="Enter phone number" onkeypress="if(event.key === 'Enter') addContact()"/>
            <button class="primary-btn" onclick="addContact()">Add Contact</button>
          </div>

          <div id="contactList" class="card-grid">
            <!-- Contacts go here -->
          </div>
        </div>

        <!-- HISTORY -->
        <div id="history" class="section">
          <div class="section-header">
            <h3>Chat History</h3>
          </div>
          
          <div id="historyBox" class="card-grid">
            <!-- History entries go here -->
          </div>
        </div>

      </div> <!-- end content container -->
    </div> <!-- end main area -->

  </div> <!-- end app layout -->

<script>
  // --- THEME LOGIC ---
  const sunIcon = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>`;
  const moonIcon = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>`;
  
  function updateThemeIcon() {
    const isDark = document.body.classList.contains('dark-theme');
    document.getElementById('themeToggleBtn').innerHTML = isDark ? sunIcon : moonIcon;
  }

  function toggleTheme() {
    document.body.classList.toggle('dark-theme');
    const isDark = document.body.classList.contains('dark-theme');
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
    updateThemeIcon();
  }

  // --- MOBILE SIDEBAR ---
  function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
  }

  // --- APP LOGIC ---
  const user = JSON.parse(localStorage.getItem("user"));
  
  if(user && user.name) {
    document.getElementById("welcome").innerText = "Welcome, " + user.name.split(" ")[0];
  }

  function showSection(id) {
    document.querySelectorAll(".section").forEach(sec => sec.classList.remove("active"));
    document.getElementById(id).classList.add("active");
    
    document.querySelectorAll(".nav-btn").forEach(btn => btn.classList.remove("active"));
    const navBtn = document.getElementById("nav-" + id);
    if(navBtn) navBtn.classList.add("active");

    // Close mobile sidebar if open
    document.getElementById('sidebar').classList.remove('open');
  }

  // --- VOICE INPUT LOGIC ---
  function startDictation() {
    if (window.hasOwnProperty('webkitSpeechRecognition') || window.hasOwnProperty('SpeechRecognition')) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const recognition = new SpeechRecognition();
      const micBtn = document.getElementById('micBtn');
      const inputField = document.getElementById('input');

      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = "en-US";
      
      recognition.onstart = function() {
        micBtn.classList.add('listening');
      };

      recognition.onresult = function(e) {
        inputField.value = e.results[0][0].transcript;
        recognition.stop();
        micBtn.classList.remove('listening');
      };

      recognition.onerror = function(e) {
        console.error("Speech recognition error", e.error);
        recognition.stop();
        micBtn.classList.remove('listening');
      };

      recognition.onend = function() {
        micBtn.classList.remove('listening');
      };

      recognition.start();
    } else {
      alert("Your browser does not support Speech Recognition.");
    }
  }

  // --- IMAGE HANDLING LOGIC ---
  let selectedImage = null;

  function previewImage(event) {
    const file = event.target.files[0];
    if (file) {
      selectedImage = file;
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = document.getElementById('imagePreview');
        img.src = e.target.result;
        document.getElementById('imagePreviewContainer').style.display = 'block';
        img.onload = () => detectEmotion(img);
      }
      reader.readAsDataURL(file);
    }
  }

  function clearImage() {
    selectedImage = null;
    document.getElementById('imageInput').value = '';
    document.getElementById('imagePreviewContainer').style.display = 'none';
    document.getElementById('imagePreview').src = '';
    document.getElementById('detectedEmotionLabel').innerText = 'Waiting for detection...';
    detectedEmotion = 'neutral';
  }

  function handleSend() {
    if (selectedImage) {
      const mapping = {
        happy: "happy",
        sad: "sad",
        surprised: "shocked",
        neutral: "neutral",
        angry: "frustrated",
        disgusted: "neutral",
        fearful: "neutral"
      };
      
      const emotionKey = mapping[detectedEmotion] || "neutral";
      
      let msg = "";
      if (selectedImage.type === 'camera') {
        msg = `I captured an image and I look ${emotionKey}`;
      } else {
        msg = `I uploaded an image and I look ${emotionKey}`;
      }
      
      document.getElementById('input').value = msg;
      clearImage();
    }
    send();
  }

  // --- CAMERA LOGIC ---
  let cameraStream = null;

  function openCamera() {
    const modal = document.getElementById('cameraModal');
    const video = document.getElementById('cameraVideo');

    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      navigator.mediaDevices.getUserMedia({ video: true })
        .then(stream => {
          cameraStream = stream;
          video.srcObject = stream;
          modal.style.display = 'flex';
        })
        .catch(err => {
          console.error("Camera access denied", err);
          alert("Camera access is required");
        });
    } else {
      alert("Camera not supported");
    }
  }

  function closeCamera() {
    const modal = document.getElementById('cameraModal');
    const video = document.getElementById('cameraVideo');

    if (cameraStream) {
      cameraStream.getTracks().forEach(track => track.stop());
      cameraStream = null;
    }
    video.srcObject = null;
    modal.style.display = 'none';
  }

  function captureImage() {
    const video = document.getElementById('cameraVideo');
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    const base64Image = canvas.toDataURL('image/png');
    
    const img = document.getElementById('imagePreview');
    img.src = base64Image;
    document.getElementById('imagePreviewContainer').style.display = 'block';
    
    selectedImage = { type: 'camera', data: base64Image };
    
    img.onload = () => detectEmotion(img);
    closeCamera();
  }

  // --- FACE-API.JS LOGIC ---
  let modelsLoaded = false;
  let detectedEmotion = "neutral";

  async function loadModels() {
    if (modelsLoaded) return;
    const MODEL_URL = 'https://justadudewhohacks.github.io/face-api.js/models';
    try {
      await Promise.all([
        faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
        faceapi.nets.faceExpressionNet.loadFromUri(MODEL_URL)
      ]);
      modelsLoaded = true;
      console.log("Models loaded");
    } catch (err) {
      console.error("Error loading models", err);
      // Fallback: stay on neutral and show log
    }
  }

  async function detectEmotion(imgElement) {
    if (!modelsLoaded) await loadModels();
    
    const label = document.getElementById('detectedEmotionLabel');
    label.innerText = "Detecting emotion...";
    
    try {
      const detections = await faceapi.detectSingleFace(imgElement, new faceapi.TinyFaceDetectorOptions()).withFaceExpressions();
      
      if (detections) {
        const expressions = detections.expressions;
        const bestMatch = Object.keys(expressions).reduce((a, b) => expressions[a] > expressions[b] ? a : b);
        
        const displayMapping = {
          happy: "Happy 😊",
          sad: "Sad 😢",
          surprised: "Surprised 😲",
          neutral: "Neutral 😐",
          angry: "Angry 😠",
          disgusted: "Neutral 😐",
          fearful: "Neutral 😐"
        };
        
        detectedEmotion = bestMatch;
        label.innerText = `Detected: ${displayMapping[bestMatch] || "Neutral 😐"}`;
      } else {
        detectedEmotion = "neutral";
        label.innerText = "Could not detect face clearly. Fallback: Neutral 😐";
      }
    } catch (err) {
      console.error("Detection error", err);
      detectedEmotion = "neutral";
      label.innerText = "Detection failed. Fallback: Neutral 😐";
    }
  }

  // --- CHAT LOGIC ---
  async function send() {
    const input = document.getElementById("input");
    const chat = document.getElementById("chatBox");

    const msg = input.value;
    if (!msg.trim()) return;

    chat.innerHTML += `<div class="message user">${msg}</div>`;
    input.value = "";
    chat.scrollTop = chat.scrollHeight;

    try {
      const res = await fetch("http://localhost:5000/message", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: msg })
      });

      const data = await res.json();

      chat.innerHTML += `<div class="message bot">${data.reply}</div>`;
      chat.scrollTop = chat.scrollHeight;

      let history = JSON.parse(localStorage.getItem("history")) || [];
      history.push({ user: msg, bot: data.reply });
      localStorage.setItem("history", JSON.stringify(history));
      
      loadHistoryView();
    } catch (error) {
      chat.innerHTML += `<div class="message bot" style="color: #ef4444">Connection error...</div>`;
      chat.scrollTop = chat.scrollHeight;
    }
  }

  async function sendEmojiMessage(emotion, emoji) {
    const chat = document.getElementById("chatBox");
    const hiddenMsg = `[EMOJI_KEYWORD_${emotion.toUpperCase()}] I am feeling ${emotion}.`;
    
    chat.innerHTML += `<div class="message user" style="font-size: 1.8em; background: transparent; box-shadow: none; padding: 5px;">${emoji}</div>`;
    chat.scrollTop = chat.scrollHeight;

    try {
      const res = await fetch("http://localhost:5000/message", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: hiddenMsg })
      });

      const data = await res.json();

      chat.innerHTML += `<div class="message bot">${data.reply}</div>`;
      chat.scrollTop = chat.scrollHeight;

      let history = JSON.parse(localStorage.getItem("history")) || [];
      history.push({ user: emoji, bot: data.reply });
      localStorage.setItem("history", JSON.stringify(history));
      
      loadHistoryView();
    } catch (error) {
      chat.innerHTML += `<div class="message bot" style="color: #ef4444">Connection error...</div>`;
      chat.scrollTop = chat.scrollHeight;
    }
  }

  // --- CARE CIRCLE LOGIC ---
  function addContact() {
    const input = document.getElementById("contact");
    const number = input.value;
    
    if (!number.trim()) return;

    let contacts = JSON.parse(localStorage.getItem("contacts")) || [];
    contacts.push(number);
    localStorage.setItem("contacts", JSON.stringify(contacts));

    renderContact(number);
    input.value = "";
  }

  function renderContact(number) {
    const list = document.getElementById("contactList");
    // Using a visual-only delete button as requested
    list.innerHTML += `
      <div class="glass-card contact-item">
        <div class="contact-info">
          <div class="contact-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
          </div>
          <div class="contact-number">${number}</div>
        </div>
        <button class="delete-btn" onclick="alert('Delete functionality is visual-only for now!')" title="Delete">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
        </button>
      </div>`;
  }

  // --- HISTORY LOGIC ---
  function loadHistoryView() {
    let history = JSON.parse(localStorage.getItem("history")) || [];
    let box = document.getElementById("historyBox");
    box.innerHTML = "";
    history.forEach(h => {
      box.innerHTML += `
        <div class="glass-card history-entry">
          <div class="h-user">You: ${h.user}</div>
          <div class="h-bot">${h.bot}</div>
        </div>`;
    });
  }

  // --- LOGOUT LOGIC ---
  function logout() {
    localStorage.removeItem("user");
    window.location.href = "login.html";
  }

  // --- INITIAL LOAD ---
  window.onload = () => {
    updateThemeIcon(); // set initial sun/moon icon
    
    if (user && user.photo) {
      document.getElementById("userAvatar").src = user.photo;
    }
    
    let contacts = JSON.parse(localStorage.getItem("contacts")) || [];
    contacts.forEach(c => renderContact(c));

    loadHistoryView();
  };
</script>

</body>
</html>
