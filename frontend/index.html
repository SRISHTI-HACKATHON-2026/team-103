<!DOCTYPE html>
<html>
<head>
  <title>Care Companion</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #6c8cff, #8fd3f4);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      width: 360px;
      height: 90vh;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }

    header {
      padding: 15px;
      color: white;
      font-weight: bold;
      text-align: center;
      background: rgba(0,0,0,0.1);
      letter-spacing: 1px;
    }

    #chat {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 18px;
      animation: fadeIn 0.3s ease;
    }

    .user {
      align-self: flex-end;
      background: #ffffff;
      color: #333;
      border-bottom-right-radius: 5px;
    }

    .assistant {
      align-self: flex-start;
      background: rgba(255,255,255,0.4);
      color: #fff;
      border-bottom-left-radius: 5px;
    }

    .input-area {
      display: flex;
      padding: 10px;
      background: rgba(0,0,0,0.1);
    }

    #input {
      flex: 1;
      padding: 12px;
      border-radius: 25px;
      border: none;
      outline: none;
      font-size: 14px;
    }

    button {
      margin-left: 8px;
      padding: 10px 14px;
      border-radius: 50%;
      border: none;
      background: white;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      transform: scale(1.1);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .typing {
      font-style: italic;
      opacity: 0.8;
    }
  </style>
</head>

<body>

<div class="app">
  <header>💛 Care Companion</header>

  <div id="chat"></div>

  <div class="input-area">
    <input id="input" placeholder="How are you feeling today?" />
    <button onclick="send()">➤</button>
  </div>
</div>

<script>
async function send() {
  const input = document.getElementById("input");
  const chat = document.getElementById("chat");

  const userText = input.value.trim();
  if (!userText) return;

  // User message
  const userMsg = document.createElement("div");
  userMsg.className = "message user";
  userMsg.innerText = userText;
  chat.appendChild(userMsg);

  input.value = "";

  // Typing indicator
  const typing = document.createElement("div");
  typing.className = "message assistant typing";
  typing.innerText = "Thinking...";
  chat.appendChild(typing);

  chat.scrollTop = chat.scrollHeight;

  try {
    const res = await fetch("http://localhost:5000/message", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ message: userText })
    });

    const data = await res.json();

    typing.innerText = data.reply;

  } catch (err) {
    typing.innerText = "Something went wrong...";
    console.error(err);
  }

  chat.scrollTop = chat.scrollHeight;
}
</script>

</body>
</html>
