<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Care Companion</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  
  <div class="login-container">
    <!-- Dark Mode Init Script (Avoids flash of light theme if dark was previously selected) -->
    <script>
      if (localStorage.getItem('theme') === 'dark') {
        document.body.classList.add('dark-theme');
      }
    </script>
    
    <div class="login-card glass-panel">
      <h2>💛 Care Companion</h2>
      <p>Sign in to continue</p>
    
      <button class="google-btn" onclick="login()">
        <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google Icon">
        Sign in with Google
      </button>

      <div class="divider">
        <span>or manual login</span>
      </div>

      <div class="manual-login-form">
        <input type="text" id="username" placeholder="Username" class="login-input" />
        <input type="password" id="password" placeholder="Password" class="login-input" onkeypress="if(event.key === 'Enter') manualLogin()"/>
        <button class="primary-btn login-submit" onclick="manualLogin()">Login</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    // 🔴 PASTE YOUR FIREBASE CONFIG HERE
    const firebaseConfig = {
        apiKey: "AIzaSyALiQCL22lAAhdhosY9BmWhj9pkQwpncsY",
        authDomain: "sandy-4637e.firebaseapp.com",
        projectId: "sandy-4637e",
        storageBucket: "sandy-4637e.firebasestorage.app",
        messagingSenderId: "558751202499",
        appId: "1:558751202499:web:1b9e72439a608fe85c7676",
        measurementId: "G-BHH4SGJBSW"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    window.login = async function () {
      try {
        const result = await signInWithPopup(auth, provider);

        const user = result.user;

        localStorage.setItem("user", JSON.stringify({
          name: user.displayName,
          email: user.email,
          photo: user.photoURL
        }));

        window.location.href = "home.html";

      } catch (error) {
        console.error(error);
        alert("Login failed");
      }
    };

    window.manualLogin = function() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      
      if (!username || !password) {
        alert("Please enter both username and password");
        return;
      }
      
      localStorage.setItem("user", JSON.stringify({
        name: username,
        type: "manual",
        photo: "https://ui-avatars.com/api/?name=" + username + "&background=6366f1&color=fff"
      }));
      
      window.location.href = "home.html";
    };
  </script>

</body>
</html>
